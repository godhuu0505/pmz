# PRマージゲートの基盤検証（lint + test）。
# 要件 §5「自分自身がDevOpsサイクルで改善される」/ W1技術設計 §9 のうち
# 「pytest をPRで実行」を最小実装する。MVPスケルトンを PR ごとに自動検証する。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一ブランチの古い実行はキャンセルして無駄を省く。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + test (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pyproject.toml と同じ uv / Python 3.11 を使う（ローカルと再現一致）。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q
